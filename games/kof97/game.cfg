# SPDX-License-Identifier: GPL-3.0-only
#
# The King of Fighters '97 (SNK 1997, Neo Geo MVS): per-game settings read by the cps2recomp toolkit (Makefile, tools
# via tools/gamecfg.py). This fork's first Neo Geo game, on the toolkit's Neo Geo board (machine/neogeo.h): for now it
# boots and plays silent in the 68000's interpreter, with no window (build/kof97/neogeo-run; openspec change
# neogeo-boot). Nothing is translated yet.

# (no colon or apostrophe trouble: the name is also the folder the player's settings are kept under)
name = The King of Fighters 97
title = The King of Fighters 97 Recomp
id = kof97
disclaimer = Not affiliated with SNK.

# The ROM set this port is made from, as arcade ROM collections name it (MAME's kof97, NGM-2320, a cartridge with no
# protection), and the name the launcher shows
rom_set = kof97
rom_parent = kof97
rom_name = The King of Fighters '97 (NGM-2320)

# The board: a Neo Geo MVS (machine/romset.h). Its system ROMs come from the set neogeo.zip, beside the game's zip.
board = neogeo
bios_set = neogeo
# The MVS system ROM (Europe, MVS v2: sp-s2.sp1), its fix tiles, its Z80 program and the sprites' shrink table, in
# this order
bios = sp-s2.sp1:9036d879 sfix.sfix:c2ea0cfd sm1.sm1:94416d67 000-lo.lo:5a86cff2

# The cartridge (MAME's checksums): the program (P1, then P2 in banks at 0x200000; words low byte first in the files),
# the fix layer's tiles (S1), the Z80's program (M1), the YM2610's samples (V1-V3) and the sprites, in pairs (C1-C6)
program = 232-p1.p1:7db81ad9 232-p2.sp2:158b23f6
fix = 232-s1.s1:8514ecf5
sound_program = 232-m1.m1:45348747
samples = 232-v1.v1:22a2b5b5 232-v2.v2:2304e744 232-v3.v3:759eb954
graphics = 232-c1.c1:5f8bf0a1+232-c2.c2:e4d45c81 232-c3.c3:581d6618+232-c4.c4:49bb1e68 232-c5.c5:34fc4e51+232-c6.c6:4ff4d47b
